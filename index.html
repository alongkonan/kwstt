<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>

@media screen{
:root{--bg:#f3f5f9;--sf:#fff;--tx:#172033;--mu:#6b7589;--bd:#e3e7ef;--ac:#4f46e5;--ac2:#eceeff;--on:#fff;--er:#d92d20;--ok:#12805c;--sh:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.05)}
body{font:400 15.5px/1.55 'IBM Plex Sans Thai',Sarabun,system-ui,sans-serif;-webkit-font-smoothing:antialiased}h1,.k,nav button,th,.p{font-family:Prompt,'IBM Plex Sans Thai',Sarabun,sans-serif}h1{letter-spacing:-.01em}#pr.cap th{font-family:inherit}header{padding:16px 20px 6px}h1{font-size:21px;font-weight:600;margin:0}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--sf);border:0;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 10px;border:0;border-radius:10px;min-width:62px;line-height:1.3}

button,select,input,textarea{border-radius:9px;padding:7px 11px;border-color:var(--bd)}button{transition:.15s}button:hover{filter:brightness(.96)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}

}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1117;--sf:#171b24;--tx:#eceff5;--mu:#9aa4b8;--bd:#2a3140;--ac:#9aa2ff;--ac2:#242a4a;--on:#0e1117;--er:#ff7b72;--ok:#4cc38a;--sh:none}}
:root[data-theme=dark]{--bg:#0e1117;--sf:#171b24;--tx:#eceff5;--mu:#9aa4b8;--bd:#2a3140;--ac:#9aa2ff;--ac2:#242a4a;--on:#0e1117;--er:#ff7b72;--ok:#4cc38a;--sh:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><h1>🏫 ระบบจัดตารางสอน โรงเรียนมัธยมศึกษา (ม.1–6)</h1></header><nav id="nv"></nav><main id="m"></main>
<dialog id="dg"></dialog><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),DN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],uid=()=>Math.random().toString(36).slice(2,8);
let S,V={merge:true,tab:'dash',mode:'cls',sel:null,ac:null,msg:'',pdf:{mode:'cls',sel:'all',school:'โรงเรียน................................',term:'ภาคเรียนที่ 1 ปีการศึกษา 2569',fs:18}};
const save=()=>{try{localStorage.setItem('tt2',JSON.stringify(S))}catch(e){}};
let PT=[];
const brk=(p,z)=>{for(let i=1;i<z;i++)if(PT[p+i]?.b)return 1;return 0};
const BT=p=>PT[p].b?`<td class="lunch">${PT[p].b.m>=30?'🍴':'☕'}</td>`:'';
const G=cid=>(byId('classes',cid)?.lv||1)>=4?'u':'l';
const PRESET=()=>[{t:'c',n:'',m:50},{t:'c',n:'',m:50},{t:'c',n:'',m:50},{t:'b',u:'c',n:'พักเที่ยง',m:50},{t:'c',u:'b',n:'พักเที่ยง',m:50},{t:'c',n:'',m:50},{t:'c',n:'',m:50},{t:'c',n:'',m:50}];
function sync(){const c=S.cfg;let[h,m]=String(c.start).split(':').map(Number);if(isNaN(h)||isNaN(m)){h=8;m=30}let t=h*60+m,br=null;PT=[];c.tl.forEach(x=>{const mn=+x.m||1,a=x.t,b=x.u||x.t;if(a=='b'&&b=='b'){br=br||{n:x.n||'พัก',m:0};br.m+=mn;t+=mn}else{PT.push({s:t,e:t+mn,k:{l:a,u:b},b:br,n:x.n||''});t+=mn;br=null}});c.per=PT.length}
function TLU(i,k,v){const x=S.cfg.tl[i];if(k=='m')x.m=Math.max(1,+v||1);else if(k=='n')x.n=v;else if(k=='t'){const lk=x.u===undefined||x.u===x.t;x.t=v;if(lk)delete x.u}else x.u=v;if(S.cfg.tl.every(r=>r.t=='b'&&(r.u||r.t)=='b'))x.t='c';sync();fit();save();R()}
function TLA(t){S.cfg.tl.push({t,n:t=='b'?'พัก':'',m:t=='b'?15:50});sync();save();R()}
function TLM(i,d){const a=S.cfg.tl,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];sync();fit();save();R()}
function TLD(i){const a=S.cfg.tl,isP=r=>!(r.t=='b'&&(r.u||r.t)=='b');if(isP(a[i])&&a.filter(isP).length<2)return alert('ต้องมีอย่างน้อย 1 คาบ');a.splice(i,1);sync();fit();save();R()}
function TLUI(){const c=S.cfg;let[h,m]=c.start.split(':').map(Number),cur=(h||8)*60+(m||0),pn=0;const ty=(i,k,v)=>`<select onchange="TLU(${i},'${k}',this.value)">${[['c','คาบเรียน'],['f','คาบว่าง'],['b','พัก']].map(o=>`<option value="${o[0]}" ${v==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
 const rows=c.tl.map((x,i)=>{const s=cur;cur+=+x.m;const sep=x.t=='b'&&(x.u||x.t)=='b';return`<tr><td>${fm(s)}–${fm(cur)}</td><td>${sep?'':'คาบ '+(++pn)}</td><td>${ty(i,'t',x.t)}</td><td>${ty(i,'u',x.u||x.t)}</td><td><input type="text" value="${x.n||''}" placeholder="ชื่อ (ไม่บังคับ)" onchange="TLU(${i},'n',this.value)"></td><td><input type="number" style="width:70px" value="${x.m}" onchange="TLU(${i},'m',this.value)"></td><td style="white-space:nowrap"><button onclick="TLM(${i},-1)">↑</button> <button onclick="TLM(${i},1)">↓</button> <button class="d" onclick="TLD(${i})">ลบ</button></td></tr>`}).join('');
 return`<div class="card"><b>โครงสร้างเวลาเรียน</b><div class="bar" style="margin-top:8px"><label>จำนวนวัน <input type="number" style="width:70px" value="${c.days}" onchange="S.cfg.days=Math.min(6,Math.max(1,+this.value||1));fit();save();R()"></label><label>เริ่มเวลา <input type="text" style="width:80px" value="${c.start}" onchange="S.cfg.start=this.value;sync();save();R()"></label><button onclick="if(confirm('ใช้ตัวอย่าง: ม.ต้นพักเที่ยงคาบ 4 / ม.ปลายพักเที่ยงคาบ 5 ? (โครงสร้างเดิมและตารางจะถูกล้าง)')){S.cfg.tl=PRESET();S.tt={};sync();save();R()}">ตัวอย่าง: ม.ต้น/ม.ปลายพักเที่ยงต่างคาบ</button></div><div class="sc"><table><tr><th>เวลา</th><th>คาบ</th><th>ม.ต้น (ม.1–3)</th><th>ม.ปลาย (ม.4–6)</th><th>ชื่อ</th><th>นาที</th><th></th></tr>${rows}</table></div><div class="bar" style="margin-top:8px"><button onclick="TLA('c')">+ คาบเรียน</button><button onclick="TLA('b')">+ พักร่วม (ทุกระดับ)</button></div><p class="mu">ตั้งประเภทแยกกันได้ระหว่าง ม.ต้นและ ม.ปลาย เช่น คาบ 4 เป็นพักเที่ยงของ ม.ต้น แต่เป็นคาบเรียนของ ม.ปลาย (เลือก “พัก” หรือ “คาบว่าง” ให้ระดับที่ต้องหยุด) ถ้าเลือก “พัก” ทั้งสองระดับ แถวนั้นจะเป็นช่วงพักคั่นร่วม ความยาวแต่ละคาบกำหนดเองได้ หลังแก้โครงสร้างควรกด “จัดอัตโนมัติ” ใหม่ เพราะตำแหน่งคาบอาจเลื่อน</p></div>`}
function norm(){S.fail=S.fail||[];S.tt=S.tt||{};for(const k of['teachers','subjects','classes','rooms','asg','sp'])S[k]=S[k]||[];S.cfg=Object.assign({days:5,per:8,lunch:4,start:'08:30',len:50},S.cfg);S.teachers.forEach(t=>t.off=t.off||[]);if(!S.cfg.tl){const c=S.cfg,tl=[];for(let i=0;i<c.per;i++){if(i==c.lunch)tl.push({t:'b',n:'พักกลางวัน',m:60});tl.push({t:'c',n:'',m:c.len||50})}c.tl=tl}sync()}
function clean(){for(const c in S.tt)for(const k in S.tt[c])if(!S.asg.some(g=>g.id==S.tt[c][k].a))delete S.tt[c][k]}
function fit(){const c=S.cfg,ok=k=>{const[d,p]=k.split('-').map(Number);return d<c.days&&p<c.per};for(const a in S.tt)for(const k in S.tt[a])if(!ok(k)||PT[+k.split('-')[1]].k[G(a)]!='c'||spAt(lvOf(a),+k.split('-')[0],+k.split('-')[1]))delete S.tt[a][k];S.teachers.forEach(t=>t.off=t.off.filter(ok))}
function demo(){
 const fn='สมชาย สมหญิง วิชัย วิภา ประเสริฐ ประภา สุรชัย สุนิสา อนุชา อรุณ กิตติ กัลยา ธนา ธิดา นพดล นภา บุญชู บุษบา มานะ มาลี'.split(' '),ln='ใจดี รักเรียน มั่นคง ศรีสุข วงศ์ไทย แก้วมณี ทองดี พึ่งบุญ เจริญผล'.split(' ');
 const subs=[['ท','ภาษาไทย',3],['ค','คณิตศาสตร์',3],['ว','วิทยาศาสตร์',3,'lab',1],['อ','ภาษาอังกฤษ',3],['ส','สังคมศึกษา',3],['พ','สุขศึกษา-พลศึกษา',2,'gym',1],['ศ','ศิลปะ',1],['ง','การงานอาชีพ',1],['คอม','คอมพิวเตอร์',2,'com',1],['ดน','ดนตรี',1,'music'],['ลก','วิชาเลือก (ม.4-6)',4,'',0,4]];
 const o={cfg:{days:5,per:8,start:'08:30',len:50,tl:PRESET()},sp:[{id:'sp1',n:'ประชุมระดับ',d:4,s:'14:20',e:'15:10',lv:[1,2,3,4,5,6],t:true}],rooms:[{id:'lab',name:'ห้องวิทยาศาสตร์',n:4},{id:'com',name:'ห้องคอมพิวเตอร์',n:3},{id:'gym',name:'โรงยิม/สนาม',n:2},{id:'music',name:'ห้องดนตรี',n:2}],subjects:[],teachers:[],classes:[],asg:[],tt:{},fail:[]};
 for(let l=1;l<=6;l++)for(let r=1;r<=6;r++)o.classes.push({id:'c'+l+r,name:`ม.${l}/${r}`,lv:l,size:33});
 let ti=0;
 subs.forEach(s=>{o.subjects.push({id:s[0],name:s[1],hrs:s[2],room:s[3]||'',dbl:!!s[4]});if(s[5])o.subjects.at(-1).hl=Object.fromEntries([1,2,3,4,5,6].map(l=>[l,l>=s[5]?s[2]:0]));
  const cs=o.classes.filter(c=>c.lv>=(s[5]||1)),n=Math.ceil(cs.length*s[2]/18),ts=[];
  for(let i=0;i<n;i++){const t={id:'t'+(++ti),name:'ครู'+fn[(ti*3)%fn.length]+' '+ln[ti%ln.length],dept:s[1],max:6,off:[]};o.teachers.push(t);ts.push(t)}
  cs.forEach((c,i)=>o.asg.push({id:uid(),cls:c.id,sub:s[0],t:ts[i%n].id}))});
 return o}
try{S=JSON.parse(localStorage.getItem('tt2'))}catch(e){}if(!S)S=demo();norm();
const K=(d,p)=>d+'-'+p,byId=(a,i)=>S[a].find(x=>x.id===i),P=()=>[...Array(S.cfg.per).keys()],Dy=()=>[...Array(S.cfg.days).keys()];
const fm=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'),tm=p=>fm(PT[p].s),te=p=>fm(PT[p].e);
const col=id=>{let h=0;for(const c of id)h=(h*37+c.charCodeAt(0))%360;return`hsl(${h} 70% 50% / .22)`};
// ---------- special periods (คาบพิเศษ) ----------
const tmin=s=>{const[h,m]=String(s).trim().replace(/\./g,':').split(':').map(Number);return isNaN(h)||h>23||(m||0)>59?NaN:h*60+(m||0)},lvOf=c=>byId('classes',c)?.lv;
const spHit=(x,d,p)=>x.d==d&&PT[p]&&PT[p].s<tmin(x.e)&&PT[p].e>tmin(x.s);
const spAt=(lv,d,p,t)=>(S.sp||[]).find(x=>(!t||x.t)&&x.lv.includes(+lv)&&spHit(x,d,p));
const spTch=(tid,d,p)=>(S.sp||[]).find(x=>x.t&&spHit(x,d,p)&&S.asg.some(g=>g.t==tid&&x.lv.includes(lvOf(g.cls))));
const cOK=(c,d,p)=>PT[p].k[G(c)]=='c'&&!spAt(lvOf(c),d,p);
const spOv=()=>{let n=0;for(const c in S.tt)for(const k in S.tt[c]){const[d,p]=k.split('-').map(Number);if(spAt(lvOf(c),d,p))n++}return n},
spApply=()=>{for(const c in S.tt)for(const k in S.tt[c]){const[d,p]=k.split('-').map(Number);if(spAt(lvOf(c),d,p))delete S.tt[c][k]}};
function SPC(undo){const n=spOv();if(n&&!confirm(`มี ${n} คาบเรียนที่ซ้อนกับคาบพิเศษนี้ ระบบจะนำคาบเหล่านั้นออกจากตาราง (กด “จัดอัตโนมัติ” ใหม่ได้ภายหลัง) ดำเนินการต่อไหม?`)){undo();return R()}spApply();save();R()}
function SPA(){const l=S.cfg.per-1,x={id:uid(),n:'ประชุมระดับ',d:Math.min(4,S.cfg.days-1),s:fm(PT[l].s),e:fm(PT[l].e),lv:[1,2,3,4,5,6],t:true};S.sp.push(x);SPC(()=>S.sp.pop())}
function SPU(i,k,v){const x=S.sp[i],o=x[k];if(k=='s'||k=='e'){if(isNaN(tmin(v))){alert('รูปแบบเวลาไม่ถูกต้อง เช่น 14:20');return R()}v=fm(tmin(v))}if(k=='d')v=+v;x[k]=v;if(tmin(x.e)<=tmin(x.s)){x[k]=o;alert('เวลาสิ้นสุดต้องอยู่หลังเวลาเริ่ม');return R()}SPC(()=>x[k]=o)}
function SPL(i,l,on){const x=S.sp[i],o=x.lv.slice();x.lv=on?[...new Set([...x.lv,l])].sort():x.lv.filter(z=>z!=l);SPC(()=>x.lv=o)}
function SPALL(i){const x=S.sp[i],o=x.lv.slice();x.lv=[1,2,3,4,5,6];SPC(()=>x.lv=o)}
